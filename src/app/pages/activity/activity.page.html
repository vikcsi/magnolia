<ion-header class="ion-no-border">
  <ion-toolbar mode="md">
    <ion-title>Tevékenység</ion-title>
    <ion-buttons slot="end" class="profile-btn-mobile">
      <ion-button (click)="openProfile()" aria-label="Profil">
        <ion-icon slot="icon-only" name="person-outline" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    <h2 class="section-title">Kategóriák</h2>

    <div class="categories-container">
      <button class="category-card" [class.active]="selectedCategory === 'transport'"
        (click)="selectCategory('transport')" [attr.aria-pressed]="selectedCategory === 'transport'">
        <div class="category-icon">
          <ion-icon name="location-outline" aria-hidden="true"></ion-icon>
        </div>
        <ion-label>Közlekedés</ion-label>
      </button>

      <button class="category-card" [class.active]="selectedCategory === 'shopping'" (click)="selectCategory('shopping')" [attr.aria-pressed]="selectedCategory === 'shopping'">
        <div class="category-icon">
          <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
        </div>
        <ion-label>Vásárlás</ion-label>
      </button>

      <button class="category-card" [class.active]="selectedCategory === 'energy'" (click)="selectCategory('energy')" [attr.aria-pressed]="selectedCategory === 'energy'">
        <div class="category-icon">
          <ion-icon name="flash-outline" aria-hidden="true"></ion-icon>
        </div>
        <ion-label>Energia</ion-label>
      </button>
    </div>


    @switch (selectedCategory) {
    @case ('transport') {
    <app-transport></app-transport>
    }
    @case ('shopping') {
    <app-shopping></app-shopping>
    }
    @case ('energy') {
    <app-energy></app-energy>
    }
    @default {
    <div>Nincs találat</div>
    }
    }
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <app-navigation></app-navigation>
</ion-footer>
