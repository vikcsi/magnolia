<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Bolygólakó</title>
  <path d="M60 8 L104 32 L104 84 L60 108 L16 84 L16 32 Z" fill="#FFD1DC" stroke="#1B1110" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="#1B1110" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <!-- Planet body (Earth-like) -->
    <circle cx="60" cy="58" r="22" fill="#3E2723"/>
    <!-- Continent: vertical landmass running through the planet -->
    <path d="M 50 42
             C 54 44, 58 44, 60 48
             C 62 52, 60 56, 58 58
             C 56 60, 55 62, 56 64
             C 58 67, 62 67, 64 70
             C 66 73, 64 76, 62 78
             L 58 78
             C 55 76, 52 74, 52 71
             C 52 68, 54 66, 52 63
             C 50 60, 47 59, 46 55
             C 45 50, 47 45, 50 42 Z"
          fill="#FFD1DC" stroke="none"/>
    <!-- Continent: smaller landmass on the right side -->
    <path d="M 68 50
             C 72 50, 75 54, 73 58
             C 71 60, 68 60, 67 57
             C 66 54, 66 51, 68 50 Z"
          fill="#FFD1DC" stroke="none"/>
    <!-- Small islands -->
    <ellipse cx="72" cy="70" rx="2.5" ry="1.8" fill="#FFD1DC" stroke="none"/>
    <ellipse cx="44" cy="64" rx="2" ry="1.5" fill="#FFD1DC" stroke="none"/>
    <!-- Saturn-like ring around the planet -->
    <ellipse cx="60" cy="58" rx="30" ry="7" fill="none" stroke="#1B1110" stroke-width="2.5"/>
  </g>
</svg>
