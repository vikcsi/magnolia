<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Kihívás elfogadva</title>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#1B1110" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="46" fill="#FFFFF7"/>
  <g stroke="#1B1110" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <!-- Calendar body -->
    <rect x="40" y="44" width="40" height="40" rx="4" fill="#3E2723"/>
    <!-- Top binding bar -->
    <rect x="40" y="44" width="40" height="10" rx="4" fill="#1B1110" stroke="none"/>
    <!-- Calendar rings (small loops on top) -->
    <line x1="50" y1="38" x2="50" y2="50" stroke-width="3"/>
    <line x1="70" y1="38" x2="70" y2="50" stroke-width="3"/>
    <!-- Checkmark inside calendar (in the body area below the binding) -->
