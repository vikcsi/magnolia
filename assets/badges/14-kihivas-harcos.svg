    <!-- Inner accent -->
    <circle cx="60" cy="72" r="8" fill="#FFE8DD" stroke="none"/>
    <!-- Star in center -->
    <path d="M60 65 L62 70 L67 70 L63 73 L65 78 L60 75 L55 78 L57 73 L53 70 L58 70 Z" fill="#1B1110" stroke="none"/>
  </g>
</svg>
